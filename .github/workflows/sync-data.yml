name: Sync verified sports data

on:
  schedule:
    # 20:17 UTC = 22:17 Israel in winter / 23:17 Israel in summer.
    - cron: '17 20 * * *'
  workflow_dispatch:

concurrency:
  group: verified-data-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh verified snapshot
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SPORTRADAR_SOCCER_API_KEY: ${{ secrets.SPORTRADAR_SOCCER_API_KEY }}
          SPORTRADAR_SOCCER_ACCESS_LEVEL: production
        run: pnpm sync:data

      - name: Sync approved image manifest
        run: pnpm sync:images

      - name: Validate athlete images
        run: pnpm validate:images

      - name: Run unit tests
        run: pnpm test

      - name: Install browser for responsive tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Run responsive browser tests
        run: pnpm test:e2e

      - name: Lint source
        run: pnpm lint

      - name: Build production app
        run: pnpm build

      - name: Persist refreshed public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/snapshot.json public/data/refresh-manifest.json public/images/athletes/manifest.json
          if git diff --cached --quiet; then
            echo "No verified data changes to publish"
            exit 0
          fi
          git commit -m "data: refresh verified sports snapshot"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload generated snapshot
        uses: actions/upload-artifact@v6
        with:
          name: verified-sports-snapshot
          path: |
            public/data/snapshot.json
            public/data/refresh-manifest.json
          if-no-files-found: error
