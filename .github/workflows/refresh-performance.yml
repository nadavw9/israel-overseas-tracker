name: Refresh athlete performance

on:
  schedule:
    # 22:30 UTC = 00:30 Israel in winter / 01:30 Israel in summer.
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh performance snapshot
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SPORTRADAR_SOCCER_API_KEY: ${{ secrets.SPORTRADAR_SOCCER_API_KEY }}
          SPORTRADAR_SOCCER_ACCESS_LEVEL: production
        run: pnpm refresh:performance

      - name: Validate athlete images
        run: pnpm validate:images

      - name: Run unit tests
        run: pnpm test

      - name: Upload refreshed snapshot and health manifest
        uses: actions/upload-artifact@v6
        with:
          name: refreshed-performance-snapshot
          path: |
            public/data/snapshot.json
            public/data/refresh-manifest.json
          if-no-files-found: error
