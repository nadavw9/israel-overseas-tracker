name: Refresh athlete performance

on:
  schedule:
    # 20:30 UTC = 22:30 Israel in winter / 23:30 Israel in summer.
    - cron: '30 20 * * *'
  workflow_dispatch:

concurrency:
  group: verified-data-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh performance snapshot
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SPORTRADAR_SOCCER_API_KEY: ${{ secrets.SPORTRADAR_SOCCER_API_KEY }}
          SPORTRADAR_SOCCER_ACCESS_LEVEL: production
        run: pnpm refresh:performance

      - name: Sync approved image manifest
        run: pnpm sync:images

      - name: Validate athlete images
        run: pnpm validate:images

      - name: Run unit tests
        run: pnpm test

      - name: Persist refreshed performance data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/snapshot.json public/data/refresh-manifest.json public/images/athletes/manifest.json
          if git diff --cached --quiet; then
            echo "No verified performance changes to publish"
            exit 0
          fi
          git commit -m "data: refresh athlete performance"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload refreshed snapshot and health manifest
        uses: actions/upload-artifact@v6
        with:
          name: refreshed-performance-snapshot
          path: |
            public/data/snapshot.json
            public/data/refresh-manifest.json
          if-no-files-found: error
